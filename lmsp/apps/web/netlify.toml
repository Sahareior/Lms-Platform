[build]
  publish = "dist"
  command = "npm run build"

# SPA fallback — any unknown path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Cache hashed assets forever ──────────────────────────────
# Vite appends a content hash to all JS/CSS filenames in /assets/,
# so they can be cached indefinitely. This prevents re-downloading
# the same chunks on every navigation.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Preconnect to API server ─────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
